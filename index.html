<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Xavi's Speelstad</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speelstad">
<meta name="theme-color" content="#29B6F6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<style>
  :root {
    --ink: #1B1B2A;
    --sky: #29B6F6;
    --grass: #34C759;
    --sun: #FFD600;
    --pick: #FFE14D;
    --far: #8FD3FF;
    --font: "Baloo 2", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; position: fixed; inset: 0;
    background: #12203F;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    font-family: var(--font);
  }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 667px; height: 375px;
    transform-origin: 0 0;
    overflow: hidden;
    background: var(--sky);
    border-radius: 0;
  }
  .screen { position: absolute; inset: 0; }
  .screen[hidden] { display: none !important; }
  .screen > svg { position: absolute; inset: 0; width: 667px; height: 375px; display: block; }

  /* ronde knoppen */
  .btn {
    appearance: none; border: 4px solid var(--ink); background: #fff;
    border-radius: 50%; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 5px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease, background .2s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn.on { background: var(--pick); }
  .btn svg { width: 70%; height: 70%; display: block; pointer-events: none; }
  .mutebtn { position: absolute; right: 12px; top: 10px; width: 50px; height: 50px; z-index: 6; padding: 6px; }
  .mutebtn svg { width: 100%; height: 100%; }
  .home-btn { position: absolute; left: 12px; top: 10px; width: 50px; height: 50px; z-index: 5; }

  /* start */
  #start {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(18, 32, 63, .55);
    display: grid; place-items: center;
  }
  #start .btn { width: 150px; height: 150px; background: var(--sun); animation: pulse 1.1s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }

  /* home */
  .title {
    position: absolute; left: 0; right: 0; top: 14px; text-align: center;
    font-size: 38px; line-height: 1; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--ink);
    pointer-events: none;
  }
  .tiles { position: absolute; left: 10px; right: 10px; top: 96px; display: flex; gap: 8px; justify-content: center; }
  .tile {
    width: 98px; height: 120px; background: #fff; border: 4px solid var(--ink);
    border-radius: 26px; box-shadow: 0 6px 0 var(--ink); position: relative; cursor: pointer;
    transition: transform .1s;
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tile.active { animation: wiggle 2.4s ease-in-out infinite; }
  .tile.locked > svg { opacity: .45; filter: grayscale(.5); }
  .tile .lock { position: absolute; right: -10px; top: -12px; width: 48px; height: 48px; opacity: 1; filter: none; }
  .tile.shake { animation: shake .4s; }
  @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-3deg); } 92% { transform: rotate(3deg); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-5px); } }

  /* bouwen */
  .sil * { fill: #C9D3E3 !important; stroke: #7F8BA3 !important; stroke-width: 3px !important; stroke-dasharray: 7 5; }
  .sil text { display: none; }
  .sil.next { animation: silpulse .7s ease-in-out infinite alternate; }
  .sil.done { display: none; }
  @keyframes silpulse { from { opacity: .55; } to { opacity: 1; } }
  .part.anim { transition: transform .28s cubic-bezier(.3,1.4,.6,1); }
  .part.popin { animation: popin .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popin { from { opacity: 0; } to { opacity: 1; } }
  .hintpath { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 2 16; animation: march .6s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -18; } }
  .spark { animation: spark .6s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes spark { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .go { position: absolute; left: 520px; top: 130px; width: 120px; height: 120px; background: #22C55E; animation: pulse .7s ease-in-out infinite alternate; }
  .go[hidden] { display: none; }
  .bounce { animation: bounce .5s cubic-bezier(.3,1.8,.5,1); transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bounce { 30% { transform: scale(1.08, .9); } 60% { transform: scale(.96, 1.06) translateY(-6px); } }

  /* rijden */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
    background: var(--grass); border-top: 4px solid var(--ink);
    display: flex; justify-content: center; align-items: center; gap: 22px;
  }
  .bar .btn { width: 62px; height: 62px; margin-top: -6px; }
  .scene .no { opacity: 0; transition: opacity 1.2s; }
  .scene .shade { opacity: 0; transition: opacity 1.2s; }
  .scene .dayon { transition: opacity 1.2s; }
  .scene.night .no { opacity: 1; }
  .scene.night .shade { opacity: .5; }
  .scene.night .dayon { opacity: 0; }
  .scene .far rect { fill: var(--far); transition: fill 1.2s; }
  .scene.night .far rect { fill: #2B3D78; }
  .glow { opacity: 0; }
  .scene.siren .glow.r { animation: blink .5s steps(1) infinite; }
  .scene.siren .glow.b { animation: blink .5s steps(1) .25s infinite; }
  @keyframes blink { 0% { opacity: .85; } 50% { opacity: 0; } }
  .carbob { animation: carbob .35s ease-in-out infinite alternate; }
  @keyframes carbob { to { transform: translateY(1.5px); } }
  .boef .leg1 { animation: legs .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
  .boef .leg2 { animation: legs .25s ease-in-out infinite alternate-reverse; transform-box: fill-box; transform-origin: 50% 0; }
  .boef.caught .leg1, .boef.caught .leg2 { animation: none; }
  .boef.fly { transition: transform .9s cubic-bezier(.5,-0.3,.6,1), opacity .9s; }
  @keyframes legs { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  .jail {
    position: absolute; right: 12px; top: 10px; height: 50px; z-index: 5;
    background: #fff; border: 4px solid var(--ink); border-radius: 18px;
    display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px;
    box-shadow: 0 4px 0 var(--ink);
  }
  .jail .bars { width: 34px; height: 34px; }
  .jail .num { font-size: 34px; line-height: 1; color: var(--ink); min-width: 22px; text-align: center; }
  .jail.pop { animation: jailpop .4s cubic-bezier(.3,1.8,.5,1); }
  @keyframes jailpop { 40% { transform: scale(1.25); } }
  .tally { display: flex; gap: 2px; }
  .tally svg { width: 20px; height: 20px; }
  .tally.many { flex-wrap: wrap; width: 152px; gap: 2px; }
  .tally.many svg { width: 13px; height: 13px; }

  /* brandweer */
  .flick { animation: flick .28s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes flick { from { transform: scale(.9, .86) skewX(-4deg); } to { transform: scale(1.06, 1.1) skewX(4deg); } }
  .puff { animation: puff 1.5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes puff { from { transform: translateY(0) scale(.6); opacity: .8; } to { transform: translateY(-50px) scale(1.4); opacity: 0; } }
  .house.out .puff { fill: #ECEFF1; animation-iteration-count: 2; }
  .rise { animation: rise 1.6s ease-out forwards; }
  @keyframes rise { from { transform: translateY(0) scale(.4); opacity: 1; } to { transform: translateY(-70px) scale(1.2); opacity: 0; } }
  .spray { animation: march .25s linear infinite; }
  .btn.hintbtn { animation: pulse .5s ease-in-out infinite alternate; background: var(--pick); }

  /* ambulance */
  .animal .happy, .animal .band { display: none; }
  .animal.healed .happy, .animal.healed .band { display: inline; }
  .animal.healed .sad { display: none; }
  .plasters {
    position: absolute; left: 50%; top: 66px; transform: translateX(-50%); z-index: 6;
    display: flex; gap: 12px; padding: 10px 12px;
    background: #fff; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 5px 0 var(--ink);
    animation: popin .35s ease-out;
  }
  .plaster {
    appearance: none; width: 104px; height: 64px; padding: 4px; cursor: pointer;
    background: #F1F8FF; border: 3px solid var(--ink); border-radius: 18px;
  }
  .plaster:active { transform: scale(.94); }
  .plaster svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .plaster.wrong { animation: shake .4s; }

  /* boerderij */
  .animal.fine .sad { display: none; }
  .animal.fine .happy { display: inline; }
  .scene .hills path { fill: #9CCC65; stroke: #1B1B2A; stroke-width: 4; transition: fill 1.2s; }
  .scene.night .hills path { fill: #2E4A2E; }
  .wieken { animation: wieken 7s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes wieken { to { transform: rotate(360deg); } }
  .food .plaster { width: 66px; height: 66px; padding: 6px; }
  .faces .plaster { width: 104px; height: 100px; padding: 2px; }
  .plaster.used { visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { .wieken { animation: none; } }

  /* vliegtuig */
  .propspin { animation: prop .09s linear infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes prop { from { transform: scaleY(1); } to { transform: scaleY(.12); } }
  .skyitem.poof > * { animation: poof .45s ease-in forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes poof { to { transform: scale(1.6); opacity: 0; } }
  .scene.night .clouds { opacity: .45; }
  .namebar { right: auto; left: 50%; transform: translateX(-50%); gap: 4px; padding: 0 12px; }
  .namebar[hidden] { display: none; }
  .namebar .nl { font-size: 34px; line-height: 1; color: #CFD8DC; width: 30px; text-align: center; transition: color .3s, transform .3s; }
  .namebar .nl.got { color: #1E4FD8; transform: scale(1.15); }

  /* boot */
  .rock { animation: rock 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 80%; }
  @keyframes rock { from { transform: rotate(-2.5deg) translateY(-1px); } to { transform: rotate(2.5deg) translateY(2px); } }
  .beam { animation: beam 4s linear infinite; }
  @keyframes beam { to { transform: rotate(360deg); } }
  .bellhint.pulse { animation: bellpulse .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 20%; }
  @keyframes bellpulse { from { transform: rotate(-14deg) scale(1); } to { transform: rotate(14deg) scale(1.15); } }
  .blink.blinking { animation: blink .5s steps(1) infinite; }
  .bob > * { animation: bob 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { from { transform: translateY(-2px) rotate(-6deg); } to { transform: translateY(3px) rotate(6deg); } }
  .bubble { animation: rise 1.2s ease-out forwards; transform-box: fill-box; }
  .plasters.side { left: auto; right: 12px; top: 68px; transform: none; flex-direction: column; gap: 8px; padding: 8px; }
  .plasters.side .plaster { width: 92px; height: 84px; padding: 4px; }
  .slotfish { width: 44px; height: 24px; filter: grayscale(1) opacity(.35); transition: filter .3s, transform .3s; }
  .slotfish.got { filter: none; transform: scale(1.15); }


  /* bouwstad */
  #bouw { background: #8CC8EE; }
  #bouw [hidden] { display: none !important; }
  #bouw > svg { position: absolute; inset: 0; width: 667px; height: 375px; touch-action: none; }
  #home .bigbtn { width: 300px; left: calc(50% - 156px); top: 216px; font-size: 20px; }
  #home .bigbtn.b2 { left: calc(50% + 156px); top: 216px; background: #FFF3C4; }
  #home .bigbtn.b3 { left: calc(50% - 156px); top: 288px; background: #FFE0B2; }
  #home .bigbtn.b4 { left: calc(50% + 156px); top: 288px; background: #E1F5FE; }
  #home .bigbtn svg { width: 130px; }
  .bchoose { position: absolute; left: 70px; right: 20px; top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .bcard { width: 128px; height: 166px; background: #fff; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 6px; cursor: pointer; }
  .bcard svg { width: 100%; height: 100%; }
  .bcard.sel { background: var(--pick); transform: scale(1.05); }
  .bshapes { position: absolute; right: 18px; top: 70px; display: flex; flex-direction: column; gap: 12px; }
  .bshape { width: 78px; height: 78px; padding: 8px; }
  .bshape svg { width: 100%; height: 100%; }
  .bshape.wrong, .bcol.wrong { animation: shake .4s; }
  .bpour { position: absolute; left: 20px; bottom: 20px; width: 84px; height: 84px; padding: 12px; background: #FFE14D; animation: pulse .7s ease-in-out infinite alternate; }
  .bpour.on { animation: none; transform: scale(.92); background: #FFC107; }
  .bcolors { position: absolute; right: 16px; bottom: 16px; display: grid; grid-template-columns: repeat(2, auto); gap: 10px; }
  .bcol { width: 64px; height: 64px; border: 4px solid var(--ink); border-radius: 12px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.18), 0 4px 0 var(--ink); }
  .bcol.big { width: 76px; height: 76px; background: #fff; padding: 4px; }
  .bcol.big svg { width: 100%; height: 100%; }
  .bdone { right: 24px; top: 80px; bottom: auto; }
  .bhorn { position: absolute; right: 22px; bottom: 22px; width: 84px; height: 84px; padding: 14px; background: #FFE14D; animation: pulse .8s ease-in-out infinite alternate; }
  .bhorn svg { width: 100%; height: 100%; }
  .bnum { font-family: "Baloo 2", "Arial Rounded MT Bold", sans-serif; font-weight: 800; font-size: 40px; fill: #2B2118; }
  .bsign { font-family: "Baloo 2", "Arial Rounded MT Bold", sans-serif; font-weight: 800; font-size: 14px; fill: #2B2118; letter-spacing: .5px; }
  .bsign.big { font-size: 20px; }
  .tcb { transform-box: fill-box; transform-origin: 50% 100%; }
  .bpulse { animation: bpulse .6s ease-in-out infinite alternate; }
  @keyframes bpulse { to { opacity: .72; } }
  .silh * { fill: rgba(43,33,24,.13) !important; stroke: rgba(43,33,24,.5) !important; stroke-dasharray: 6 5; }
  .apart { cursor: grab; }
  .bld { transform-box: fill-box; transform-origin: 50% 100%; }



  /* bus */
  #vervoer { background: #8CC8EE; }
  #vervoer [hidden] { display: none !important; }
  #vervoer > svg { position: absolute; inset: 0; width: 667px; height: 375px; touch-action: none; }
  .vsign { font-family: "Baloo 2", "Arial Rounded MT Bold", sans-serif; font-weight: 800; font-size: 16px; }
  .pas { cursor: pointer; }
  .vcount { position: absolute; right: 16px; top: 12px; display: flex; align-items: center; gap: 8px; background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 2px 14px; font-size: 30px; }
  .vcount .vlabel { font-size: 15px; color: #6E655C; }
  .vgo { position: absolute; right: 18px; bottom: 16px; width: 82px; height: 82px; background: #22C55E; animation: pulse .8s ease-in-out infinite alternate; }
  .vgo svg { width: 100%; height: 100%; }
  .vans { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 16px; z-index: 6; }
  .vansb { width: 92px; height: 82px; background: #fff; font-size: 44px; color: var(--ink); }
  .vansb.wrong { animation: shake .4s; }
  .vagain { position: absolute; right: 18px; bottom: 16px; width: 82px; height: 82px; background: #22C55E; }
  .vagain svg { width: 100%; height: 100%; }
  .vstars { position: absolute; left: 76px; top: 12px; display: flex; align-items: center; gap: 6px; font-size: 26px; background: #fff; border: 4px solid var(--ink); border-radius: 16px; padding: 2px 12px; }
  .vstars svg { width: 32px; height: 32px; }

  /* supermarkt */
  #winkel { background: #FFF8E1; }
  #winkel [hidden] { display: none !important; }
  #winkel > svg { position: absolute; inset: 0; width: 667px; height: 375px; touch-action: none; }
  .wsign { font-family: "Baloo 2", "Arial Rounded MT Bold", sans-serif; font-weight: 800; font-size: 18px; fill: var(--ink); }
  .wnum { font-family: "Baloo 2", "Arial Rounded MT Bold", sans-serif; font-weight: 800; font-size: 30px; fill: var(--ink); }
  .wnum.small { font-size: 18px; }
  .wprod { cursor: pointer; }
  #belt.rolling { animation: belt .42s linear; }
  @keyframes belt { from { transform: translateX(-46px); } to { transform: translateX(0); } }
  #scanner { cursor: pointer; }
  .wprod.wrong { animation: shake .4s; transform-box: fill-box; }
  .wlist { position: absolute; left: 16px; bottom: 10px; display: flex; gap: 8px; z-index: 5; }
  .witem { position: relative; width: 58px; height: 58px; background: #fff; border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); padding: 4px; cursor: pointer; }
  .witem svg { width: 100%; height: 100%; }
  .witem.done { background: #C8E6C9; }
  .wcount { position: absolute; right: -6px; bottom: -8px; background: var(--ink); color: #fff; font-size: 14px; border-radius: 9px; padding: 0 5px; }
  .wcart { position: absolute; right: 16px; bottom: 14px; width: 74px; height: 74px; padding: 10px; background: #FFE14D; }
  .wcart svg { width: 100%; height: 100%; }
  .wbadge { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 28px; border-radius: 14px; background: #FF5252; color: #fff; font-size: 18px; line-height: 24px; border: 3px solid var(--ink); }
  .wkassa { position: absolute; right: 100px; bottom: 14px; width: 74px; height: 74px; padding: 10px; background: #22C55E; animation: pulse .8s ease-in-out infinite alternate; }
  .wkassa svg { width: 100%; height: 100%; }
  .wklok { position: absolute; left: 70px; top: 16px; width: 240px; height: 22px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; overflow: hidden; }
  .wklok i { display: block; height: 100%; width: 100%; background: #22C55E; }
  .wcartov { position: absolute; inset: 0; background: rgba(27,27,42,.45); display: grid; place-items: center; z-index: 8; }
  .wcartbox { background: #fff; border: 4px solid var(--ink); border-radius: 20px; padding: 14px; max-width: 520px; }
  .wcartrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .wtotaal { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; display: flex; align-items: center; gap: 6px; background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 4px 14px; font-size: 32px; }
  .wtotaal .wmunt svg { width: 34px; height: 34px; display: block; }
  .wpurse { position: absolute; left: 16px; bottom: 12px; display: flex; gap: 10px; }
  .wcoin { width: 72px; height: 72px; padding: 6px; background: #fff; }
  .wcoin svg { width: 100%; height: 100%; }
  .wbetaald { position: absolute; right: 16px; bottom: 26px; font-size: 22px; background: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 4px 12px; }
  .wstars { position: absolute; right: 16px; top: 12px; display: flex; align-items: center; gap: 6px; font-size: 28px; background: #fff; border: 4px solid var(--ink); border-radius: 16px; padding: 2px 12px; }
  .wstars svg { width: 34px; height: 34px; }
  .wagain { position: absolute; right: 20px; bottom: 16px; width: 80px; height: 80px; background: #22C55E; }
  .wagain svg { width: 100%; height: 100%; }

  /* boerderij (sim) */
  .bigbtn { position: absolute; left: 50%; top: 230px; transform: translateX(-50%); width: 360px; height: 62px; white-space: nowrap;
    display: flex; align-items: center; gap: 8px; padding: 0 16px 0 6px; background: #FFF8E1; border: 4px solid var(--ink);
    border-radius: 22px; box-shadow: 0 5px 0 var(--ink); font: inherit; font-size: 22px; color: var(--ink); cursor: pointer; }
  .bigbtn:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .bigbtn svg { width: 170px; height: 54px; flex: none; }
  #farm { background: #8BC34A; }
  #farm > svg { position: absolute; inset: 0; width: 667px; height: 375px; }
  .farmbg { position: absolute; inset: 0; background: linear-gradient(#29B6F6 0 45%, #8BC34A 45%); }
  .farmbg.market { background: linear-gradient(#FFE0B2 0 60%, #BCAAA4 60%); }
  .ftitle { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-size: 30px; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  .pickrow { position: absolute; top: 80px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
  .pickcard { width: 138px; height: 140px; background: #fff; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 6px; cursor: pointer; }
  .pickcard svg, .buybtn svg { width: 100%; height: 100%; }
  .pickcard.sel, .namebtn.sel { background: var(--pick); transform: scale(1.06); }
